<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torneo Futbolín - La Sitgetana</title>

    <!-- PWA: icono y app instalable -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Torneo Futbolín">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('fondo1.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0; padding: 20px; height: 100vh; 
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box; overflow: hidden; position: relative;
        }

        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: 0;
        }
        
        body.modo-juego { padding: 0; background-image: url('fondo2.jpg'); }
        
        .contenedor-principal {
            position: relative; z-index: 1; width: 90%; max-width: 650px;
            background: rgba(235, 235, 235, 0.95);
            backdrop-filter: blur(8px); border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 40px 30px; text-align: center; box-sizing: border-box;
        }
        
        #pantalla-inicio-container { max-width: 450px; margin: 0 auto; }

        .contenedor-principal.oscuro { background: rgba(34, 37, 42, 0.9); max-width: 1200px; }

        body.modo-juego .contenedor-principal {
            max-width: 100% !important; width: 100vw !important; height: 100vh !important; 
            padding: 10px; border-radius: 0; display: flex; flex-direction: column;
            background: rgba(18, 19, 21, 0.2) !important;
        }

        .logo-sitgetana { max-width: 250px; width: 70%; margin-bottom: 15px; }
        
        .titulo-inscripcions { color: #f2a900; font-size: 42px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }

        textarea {
            width: 100%; height: 150px; padding: 15px; background: rgba(0,0,0,0.7); 
            border: 2px solid #555; color: #fff; border-radius: 10px; font-size: 18px;
        }

        .contenedor-radio {
            display: flex; justify-content: space-around; margin-top: 20px;
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px;
        }
        .opcion-radio {
            display: flex; align-items: center; color: #f2a900; 
            font-weight: bold; font-size: 18px; cursor: pointer;
        }
        .opcion-radio input {
            margin-right: 10px; transform: scale(1.5); cursor: pointer;
        }
        
        .btn-principal {
            padding: 15px 30px; margin-top: 15px; background-color: #f2a900; 
            color: #111; border: none; border-radius: 8px; font-size: 18px; 
            font-weight: 800; cursor: pointer; text-transform: uppercase;
        }

        .liguilla-layout { display: flex; gap: 15px; height: 100%; overflow: hidden; padding: 10px; }
        .col-partidos { flex: 1.4; overflow-y: auto; padding-right: 15px; border-right: 1px solid rgba(242,169,0,0.3); }
        .col-tabla { flex: 1.6; background: rgba(0,0,0,0.6); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
        
        .match-card-liguilla { background: rgba(44, 47, 54, 0.9); border: 1px solid #444; margin-bottom: 6px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; padding: 12px 15px; width: 100%; box-sizing: border-box; }
        .match-teams { display: flex; width: 100%; align-items: center; justify-content: center; }
        .team-label-liguilla { flex: 1; color: #eee; font-weight: bold; font-size: 18px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-input { width: 55px; height: 40px; background: #000; border: 1px solid #f2a900; color: #f2a900; text-align: center; font-size: 22px; font-weight: bold; border-radius: 4px; margin: 0 15px; flex-shrink: 0; }

        table { width: 100%; color: white; border-collapse: collapse; font-size: 19px; } 
        th { border-bottom: 2px solid #f2a900; padding: 10px 5px; color: #f2a900; text-transform: uppercase; font-size: 14px; }
        td { padding: 12px 5px; border-bottom: 1px solid #333; text-align: center; }
        .fila-lider { background: rgba(242, 169, 0, 0.15); font-weight: bold; color: #f2a900; }
        
        .nombre-equipo-tabla { text-align: left; font-weight: bold; color: #fff; cursor: pointer; text-decoration: underline rgba(242, 169, 0, 0.3); }
        .nombre-equipo-tabla:hover { color: #f2a900; }

        .titulo-ronda-liguilla { color: #f2a900; background: rgba(0,0,0,0.5); padding: 5px; margin: 15px 0 8px 0; font-size: 14px; font-weight: bold; text-align: left; border-left: 4px solid #f2a900; padding-left: 10px; }
        
        #modal-historial {
            display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            align-items: center; justify-content: center;
        }
        .contenido-modal {
            background: #222; border: 2px solid #f2a900; border-radius: 15px;
            width: 90%; max-width: 500px; padding: 25px; color: white; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .lista-historial { list-style: none; padding: 0; margin: 20px 0; max-height: 300px; overflow-y: auto; }
        .item-historial { 
            padding: 10px; border-bottom: 1px solid #444; display: flex; justify-content: space-between; font-size: 18px;
        }
        .resultado-ganado { color: #4CAF50; font-weight: bold; }
        .resultado-perdido { color: #f44336; font-weight: bold; }
        .resultado-empate { color: #aaa; }

        #pantalla-campeon { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    </style>
</head>
<body>
    <audio id="audio-paso" src="paso.mp3" preload="auto"></audio>
    <audio id="audio-campeon" src="campeon.mp3" preload="auto"></audio>

    <div id="modal-historial">
        <div class="contenido-modal">
            <h2 id="modal-titulo" style="color: #f2a900; margin-top: 0; text-transform: uppercase;"></h2>
            <ul id="modal-lista" class="lista-historial"></ul>
            <button class="btn-principal" style="width: 100%;" onclick="cerrarModal()">TANCAR</button>
        </div>
    </div>

    <div id="main-container" class="contenedor-principal">
        <div id="pantalla-bienvenida">
            <img src="fondo.png" alt="La Sitgetana" class="logo-sitgetana">
            <h2 style="color: white;">Torneo Futbolín</h2>
            <button class="btn-principal" onclick="irAInscripcion()">➕ Crear Torneo</button>
        </div>

        <div id="pantalla-inicio" style="display:none;">
            <div id="pantalla-inicio-container">
                <div class="titulo-inscripcions">Inscripcions</div>
                <textarea id="parejasInput" placeholder="Nombre de los equipos..."></textarea>
                <div id="contador-parejas" style="color:#f2a900; font-weight:bold; margin-top:10px; font-size: 18px;">Equipos: 0</div>
                
                <div class="contenedor-radio">
                    <label class="opcion-radio">
                        <input type="radio" name="modoTorneo" value="liguilla" checked> Liguilla
                    </label>
                    <label class="opcion-radio">
                        <input type="radio" name="modoTorneo" value="eliminatoria"> Eliminatorias
                    </label>
                </div>

                <button class="btn-principal" onclick="procesarTorneo()">🎲 Generar</button>
            </div>
        </div>

        <div id="pantalla-juego" style="display:none; height:100%;">
            <div id="render-area" style="height:100%;"></div>
        </div>

        <div id="pantalla-campeon">
            <h1 style="color:white; font-size: 40px;">🏆 ¡CAMPEONES!</h1>
            <div id="nombre-campeon-texto" style="font-size: 60px; color:#f2a900; font-weight:900; text-transform:uppercase; text-align: center;"></div>
            <button class="btn-principal" onclick="location.reload()">🔄 Nuevo Torneo</button>
        </div>
    </div>

    <script>
        let equiposOriginales = [];
        let liguillaRondas = [];
        let bracket = [];

        function irAInscripcion() {
            document.getElementById('pantalla-bienvenida').style.display = 'none';
            document.getElementById('pantalla-inicio').style.display = 'block';
            document.getElementById('main-container').classList.add('oscuro');
            document.getElementById('main-container').style.maxWidth = "450px";
        }

        document.getElementById('parejasInput').addEventListener('input', function() {
            let n = this.value.split('\n').map(p => p.trim()).filter(p => p !== '').length;
            document.getElementById('contador-parejas').innerText = `Equipos: ${n}`;
        });

        function procesarTorneo() {
            let lista = document.getElementById('parejasInput').value.split('\n').map(p => p.trim()).filter(p => p !== '');
            if (lista.length < 2) return;
            let modoElegido = document.querySelector('input[name="modoTorneo"]:checked').value;
            reproducirSonido('audio-paso');
            lista.sort(() => Math.random() - 0.5);
            equiposOriginales = [...lista];
            document.body.classList.add('modo-juego');
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('pantalla-juego').style.display = 'block';
            document.getElementById('main-container').style.maxWidth = "1200px";
            if (modoElegido === "liguilla") {
                iniciarLiguillaOrdenada(equiposOriginales);
            } else {
                iniciarEliminatoria(equiposOriginales);
            }
        }

        function iniciarLiguillaOrdenada(lista) {
            let n = lista.length;
            let tempEquipos = [...lista];
            if (n % 2 !== 0) { tempEquipos.push("FANTASMA"); n++; }
            const numRondas = n - 1;
            const partidosPorRonda = n / 2;
            liguillaRondas = [];
            for (let r = 0; r < numRondas; r++) {
                let jornada = [];
                for (let i = 0; i < partidosPorRonda; i++) {
                    let local = tempEquipos[i];
                    let visitante = tempEquipos[n - 1 - i];
                    if (local !== "FANTASMA" && visitante !== "FANTASMA") jornada.push({ local, visitante, gL: "", gV: "", jugado: false });
                }
                liguillaRondas.push(jornada);
                tempEquipos.splice(1, 0, tempEquipos.pop());
            }
            dibujarLiguilla();
        }

        function dibujarLiguilla() {
            let html = `<div class="liguilla-layout">
                <div class="col-partidos">
                    <h3 style="color:#f2a900; margin-top:0; text-align:center;">CALENDARIO</h3>
                    ${liguillaRondas.map((ronda, rIdx) => `
                        <div class="titulo-ronda-liguilla">RONDA ${rIdx + 1}</div>
                        ${ronda.map((p, pIdx) => `
                            <div class="match-card-liguilla">
                                <div class="match-teams">
                                    <span class="team-label-liguilla" style="text-align:right;">${p.local}</span>
                                    <input type="number" inputmode="numeric" id="input-${rIdx}-${pIdx}-L" class="score-input" value="${p.gL}" onchange="manejarInputLiguilla(${rIdx}, ${pIdx}, 'gL', this.value)">
                                    <span style="color:#f2a900; font-weight:bold;">VS</span>
                                    <input type="number" inputmode="numeric" id="input-${rIdx}-${pIdx}-V" class="score-input" value="${p.gV}" onchange="manejarInputLiguilla(${rIdx}, ${pIdx}, 'gV', this.value)">
                                    <span class="team-label-liguilla" style="text-align:left;">${p.visitante}</span>
                                </div>
                            </div>`).join('')}
                    `).join('')}
                </div>
                <div class="col-tabla" id="col-tabla-dinamica"></div>
            </div>`;
            document.getElementById('render-area').innerHTML = html;
            actualizarTabla();
        }

        function manejarInputLiguilla(rIdx, pIdx, campo, val) {
            let num = parseInt(val);
            
            // 1. Control individual
            if (num < 0 || num > 11) {
                alert("Els gols de l'equip no poden superar els 11 gols");
                liguillaRondas[rIdx][pIdx][campo] = "";
                document.getElementById(`input-${rIdx}-${pIdx}-${campo.charAt(1)}`).value = "";
                actualizarTabla();
                return;
            }

            liguillaRondas[rIdx][pIdx][campo] = isNaN(num) ? "" : num.toString();

            let gL_raw = liguillaRondas[rIdx][pIdx].gL;
            let gV_raw = liguillaRondas[rIdx][pIdx].gV;

            if (gL_raw !== "" && gV_raw !== "") {
                let gL = parseInt(gL_raw);
                let gV = parseInt(gV_raw);
                let suma = gL + gV;

                // 2. Control Suma Máxima
                if (suma > 11) {
                    alert("Els gols totals no poden superar els 11 gols");
                    limpiarPartido(rIdx, pIdx);
                    return;
                }

                // 3. Control Suma Exacta 11
                if (suma !== 11) {
                    alert("Els gols total tenen que sumar 11 gols");
                    limpiarPartido(rIdx, pIdx);
                    return;
                }

                liguillaRondas[rIdx][pIdx].jugado = true;
            } else {
                liguillaRondas[rIdx][pIdx].jugado = false;
            }
            
            actualizarTabla();
        }

        function limpiarPartido(rIdx, pIdx) {
            liguillaRondas[rIdx][pIdx].gL = "";
            liguillaRondas[rIdx][pIdx].gV = "";
            liguillaRondas[rIdx][pIdx].jugado = false;
            document.getElementById(`input-${rIdx}-${pIdx}-L`).value = "";
            document.getElementById(`input-${rIdx}-${pIdx}-V`).value = "";
            actualizarTabla();
        }

        function actualizarTabla() {
            let stats = equiposOriginales.map(e => ({ nombre: e, pts: 0, pj: 0, gf: 0, gc: 0, dg: 0 }));
            let jugados = 0; let totalP = 0;
            liguillaRondas.forEach(r => r.forEach(p => {
                totalP++;
                if (p.jugado) {
                    jugados++;
                    let sL = stats.find(s => s.nombre === p.local);
                    let sV = stats.find(s => s.nombre === p.visitante);
                    sL.pj++; sV.pj++;
                    let gL = parseInt(p.gL) || 0, gV = parseInt(p.gV) || 0;
                    sL.gf += gL; sL.gc += gV; sV.gf += gV; sV.gc += gL;
                    if (gL > gV) sL.pts++; else if (gV > gL) sV.pts++;
                }
            }));
            stats.forEach(s => s.dg = s.gf - s.gc);
            stats.sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf);
            
            let htmlT = `<h3 style="color:#f2a900; margin-top:0; text-align:center;">CLASIFICACIÓN</h3>
            <table><thead><tr><th style="width:30px">#</th><th style="text-align:left">Equipo</th><th>PJ</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead>
            <tbody>${stats.map((s, i) => `<tr class="${i === 0 && s.pj > 0 ? 'fila-lider' : ''}"><td>${i + 1}</td><td class="nombre-equipo-tabla" onclick="abrirHistorial('${s.nombre}')">${s.nombre}</td><td>${s.pj}</td><td>${s.gf}</td><td>${s.gc}</td><td>${s.dg}</td><td><strong>${s.pts}</strong></td></tr>`).join('')}</tbody></table>`;
            
            if (jugados === totalP && totalP > 0) htmlT += `<button class="btn-principal" style="width:100%; margin-top:20px;" onclick="verificarGanador(${JSON.stringify(stats).replace(/"/g, '&quot;')})">🏆 FINALIZAR</button>`;
            document.getElementById('col-tabla-dinamica').innerHTML = htmlT;
        }

        function abrirHistorial(nombre) {
            const modal = document.getElementById('modal-historial');
            const titulo = document.getElementById('modal-titulo');
            const lista = document.getElementById('modal-lista');
            titulo.innerText = nombre;
            lista.innerHTML = "";
            let partidosEncontrados = 0;
            liguillaRondas.forEach((ronda) => {
                ronda.forEach(p => {
                    if (p.jugado && (p.local === nombre || p.visitante === nombre)) {
                        partidosEncontrados++;
                        const esLocal = (p.local === nombre);
                        const rival = esLocal ? p.visitante : p.local;
                        const golesPropios = esLocal ? parseInt(p.gL) : parseInt(p.gV);
                        const golesRival = esLocal ? parseInt(p.gV) : parseInt(p.gL);
                        let claseResultado = "resultado-empate";
                        let textoResultado = "E";
                        if (golesPropios > golesRival) { claseResultado = "resultado-ganado"; textoResultado = "V"; }
                        else if (golesPropios < golesRival) { claseResultado = "resultado-perdido"; textoResultado = "D"; }
                        const li = document.createElement('li');
                        li.className = "item-historial";
                        li.innerHTML = `<span>vs <strong>${rival}</strong></span><span><span class="${claseResultado}">[${textoResultado}]</span> ${golesPropios} - ${golesRival}</span>`;
                        lista.appendChild(li);
                    }
                });
            });
            if (partidosEncontrados === 0) lista.innerHTML = "<li style='text-align:center; padding:20px;'>Encara no s'ha jugat cap partit.</li>";
            modal.style.display = "flex";
        }

        function cerrarModal() { document.getElementById('modal-historial').style.display = "none"; }

        function verificarGanador(stats) {
            if (stats[0].pts === stats[1]?.pts && stats[0].dg === stats[1]?.dg) {
                const empatados = stats.filter(s => s.pts === stats[0].pts && s.dg === stats[0].dg).map(e => e.nombre);
                document.getElementById('col-tabla-dinamica').innerHTML += `<button class="btn-principal" onclick="iniciarLiguillaOrdenada(${JSON.stringify(empatados).replace(/"/g, '&quot;')})">DESEMPATE</button>`;
            } else { finalizarTorneo(stats[0].nombre); }
        }

        function iniciarEliminatoria(lista) { construirEsqueleto(lista); actualizarYDibujarBracket(); }
        function construirEsqueleto(parejas) {
            bracket = []; let num = parejas.length;
            while (num > 1) {
                let ronda = []; let i = 0;
                while (i < num) {
                    if (num - i === 3) { ronda.push({ tipo: 'triangular', p1: '?', p2: '?', p3: '?', ganador: null }); break; }
                    else { ronda.push({ tipo: 'normal', p1: '?', p2: '?', p3: null, ganador: null }); i += 2; }
                }
                bracket.push(ronda); num = ronda.length;
            }
            let idx = 0;
            bracket[0].forEach(p => { p.p1 = parejas[idx++] || '?'; p.p2 = parejas[idx++] || '?'; if (p.tipo === 'triangular') p.p3 = parejas[idx++] || '?'; });
        }
        function actualizarYDibujarBracket() {
            for (let r = 0; r < bracket.length - 1; r++) {
                let gans = bracket[r].map(p => p.ganador);
                let iG = 0;
                bracket[r+1].forEach(p => {
                    p.p1 = gans[iG++] || '?'; p.p2 = gans[iG++] || '?';
                    if (p.tipo === 'triangular') p.p3 = gans[iG++] || '?';
                });
            }
            let html = `<div class="bracket-scroll-area"><div class="bracket-container">`;
            bracket.forEach((ronda, rIdx) => {
                let nom = ["FINAL", "SEMIS", "CUARTOS", "OCTAVOS"][bracket.length - 1 - rIdx] || `R${rIdx + 1}`;
                html += `<div class="columna-ronda"><div class="titulo-ronda">${nom}</div><div class="partidos-contenedor">`;
                ronda.forEach((p, pIdx) => {
                    html += `<div class="match-bracket">`;
                    [p.p1, p.p2, p.p3].filter(j => j !== null).forEach(j => {
                        let sel = p.ganador === j ? 'seleccionado' : '';
                        html += `<button class="btn-opcion ${sel}" onclick="elegirGanadorBracket(${rIdx}, ${pIdx}, '${j}')">${j === '?' ? '&nbsp;' : j}</button>`;
                    });
                    html += `</div>`;
                });
                html += `</div></div>`;
            });
            html += `</div></div>`;
            document.getElementById('render-area').innerHTML = html;
        }
        function elegirGanadorBracket(r, p, g) {
            if (g === '?') return;
            bracket[r][p].ganador = (bracket[r][p].ganador === g) ? null : g;
            actualizarYDibujarBracket();
            if (r === bracket.length - 1 && bracket[r][p].ganador) finalizarTorneo(g);
        }
        function reproducirSonido(id) {
            const audio = document.getElementById(id);
            if (!audio) return;
            audio.currentTime = 0;
            audio.play().catch(() => {}); // el navegador puede bloquear el autoplay hasta la primera interacción; se ignora el error
        }

        function finalizarTorneo(campeon) {
            document.getElementById('pantalla-juego').style.display = 'none';
            document.getElementById('pantalla-campeon').style.display = 'flex';
            document.getElementById('nombre-campeon-texto').innerText = campeon;
            reproducirSonido('audio-campeon');
        }
    </script>
</body>
</html>
